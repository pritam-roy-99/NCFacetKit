name: Publish NCFacetKit source

on:
  push:
    paths:
      - ".github/workflows/unpack-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/source.part* | base64 --decode | tar -xJf -
          test -s src/ncfacetkit/core.py
          test -s src/ncfacetkit/bounds.py
          test -s src/ncfacetkit/behavior.py
          test -s tests/test_advanced.py

      - name: Run package regression tests
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Commit tested sources without restricted workflow file
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tests.yml
          rm -rf .upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested NCFacetKit v0.2.0 source and examples"
            git push origin HEAD:main
          fi
