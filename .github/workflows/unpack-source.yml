name: Publish NCFacetKit source

on:
  push:
    paths:
      - ".github/workflows/unpack-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply exact arithmetic optimization patch
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/optimization.part* | base64 --decode | xz -d > /tmp/ncf.patch
          echo "0d732285fea50f5c3d9c49e2bc6b99cfcf01eef1fcb1cb6f03f91bb7fbeeb11e  /tmp/ncf.patch" | sha256sum --check
          # The published README is shorter than the development README.
          # Upgrade code first; README is updated separately.
          sed -n '/^--- a\/pyproject.toml/,$p' /tmp/ncf.patch > /tmp/ncf-code.patch
          patch -p1 --batch --forward < /tmp/ncf-code.patch
          test -s src/ncfacetkit/core.py
          test -s tests/test_optimization.py

      - name: Run regression tests
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Publish tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Optimize NCFacetKit exact geometry and integer vertex enumeration"
            git push origin HEAD:main
          fi
