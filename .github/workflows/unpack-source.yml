name: Publish NCFacetKit source

on:
  push:
    paths:
      - ".github/workflows/unpack-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply exact feasible-basis pivot upgrade
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/pivot.part* | base64 --decode | xz -d > /tmp/ncf-pivot.patch
          echo "a8042f5605462a179e97eb734de8ba62a3433aa066d09c21e645883bdd8ef5e3  /tmp/ncf-pivot.patch" | sha256sum --check
          patch -p1 --batch --forward < /tmp/ncf-pivot.patch
          test -s src/ncfacetkit/core.py
          test -s tests/test_pivot.py

      - name: Run regression tests
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Commit tested v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add complete exact feasible-basis pivot enumeration"
            git push origin HEAD:main
          fi
